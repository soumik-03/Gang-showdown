<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Friend Showdown - The Gang Brawler</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥊</text></svg>">
</head>
<body>

  <div id="gameContainer">
    <!-- Game Canvas (16:9 1200x675) -->
    <canvas id="gameCanvas" width="1200" height="675"></canvas>

    <!-- Top Floating Toolbar -->
    <div class="top-controls">
      <button id="btnMute" class="control-pill">🔊 SOUND ON</button>
      <button id="btnHelp" class="control-pill" onclick="alert('🎮 CONTROLS:\n• Move: A / D or ◀ / ▶\n• Jump: W or ▲\n• Crouch: S or ▼\n• Punch: J\n• Kick: K\n• Block: Hold Back or H\n• Super Move: Space or L (when meter is 100%)\n\n📱 Mobile: Use virtual buttons at bottom!')">❓ CONTROLS</button>
    </div>

    <!-- 1. SCREEN: TITLE / START -->
    <div id="screenTitle" class="overlay-screen">
      <h1 class="arcade-title">FRIEND SHOWDOWN</h1>
      <p class="subtitle">THE GANG BRAWLER • WHO IS THE REAL BOSS?</p>
      
      <button id="btnTitleStart" class="btn-arcade" onclick="
        document.getElementById('screenTitle').classList.add('hidden');
        document.getElementById('screenSelect').classList.remove('hidden');
        window.soundEngine.init();
        window.soundEngine.playWhoosh();
      ">PRESS START</button>

      <div class="keyboard-guide">
        <p>Controls: <kbd>A</kbd>/<kbd>D</kbd> Move • <kbd>W</kbd> Jump • <kbd>J</kbd> Punch • <kbd>K</kbd> Kick • <kbd>Space</kbd> Super</p>
      </div>
    </div>

    <!-- 2. SCREEN: CHARACTER SELECT -->
    <div id="screenSelect" class="overlay-screen hidden">
      <div class="select-container">
        <h2 class="arcade-title" style="font-size: 36px; margin: 0;">SELECT YOUR FIGHTER</h2>

        <!-- Character Selection Grid -->
        <div id="charGrid" class="char-grid">
          <!-- Filled dynamically by game.js -->
        </div>

        <!-- Selected Character Info Card -->
        <div id="infoP1" class="char-details-box">
          <!-- Populated by game.js -->
        </div>

        <!-- Options: Mode, Stage & Difficulty -->
        <div class="options-row">
          <div class="option-group">
            <label>Mode:</label>
            <select id="selectMode" onchange="window.gameInstance.gameMode = this.value">
              <option value="cpu">1P vs CPU</option>
              <option value="local2p">2-Player (Same Keyboard)</option>
            </select>
          </div>

          <div class="option-group">
            <label>Difficulty:</label>
            <select id="selectDiff" onchange="window.gameInstance.aiDifficulty = this.value">
              <option value="easy">Easy</option>
              <option value="medium" selected>Medium</option>
              <option value="hard">Hard</option>
            </select>
          </div>

          <div class="option-group">
            <label>Arena:</label>
            <select id="selectStage" onchange="window.gameInstance.selectedStage = this.value">
              <option value="canteen">College Canteen</option>
              <option value="tapri">Chai Tapri Corner</option>
              <option value="gaming">999 Ping Gaming Den</option>
            </select>
          </div>

          <button id="btnFightStart" class="btn-arcade" style="padding: 10px 32px; font-size: 20px;" onclick="window.gameInstance.startFight()">
            FIGHT! 🥊
          </button>
        </div>
      </div>
    </div>

    <!-- 3. SCREEN: VICTORY / K.O. -->
    <div id="screenVictory" class="overlay-screen hidden">
      <div class="victory-box">
        <h2 id="vicWinnerTitle" class="victory-title">PLAYER WINS!</h2>
        <p id="vicQuote" class="victory-quote">"Win quote here"</p>
        <p id="vicRoast" class="victory-roast">"Roast here"</p>
        
        <div class="victory-actions">
          <button class="btn-arcade" onclick="window.gameInstance.startFight()">REMATCH 🔁</button>
          <button class="btn-arcade btn-secondary" onclick="
            document.getElementById('screenVictory').classList.add('hidden');
            document.getElementById('screenSelect').classList.remove('hidden');
          ">CHANGE FIGHTER</button>
        </div>
      </div>
    </div>

    <!-- 4. MOBILE VIRTUAL GAMEPAD OVERLAY -->
    <div id="mobileControls" class="hidden">
      <!-- Movement D-Pad (Left side) -->
      <div class="touch-cluster">
        <button id="btnLeft" class="touch-btn">◀</button>
        <button id="btnRight" class="touch-btn">▶</button>
        <button id="btnJump" class="touch-btn">▲</button>
        <button id="btnCrouch" class="touch-btn">▼</button>
      </div>

      <!-- Action Buttons (Right side) -->
      <div class="touch-cluster">
        <button id="btnPunch" class="touch-btn">PUNCH</button>
        <button id="btnKick" class="touch-btn">KICK</button>
        <button id="btnBlock" class="touch-btn">BLOCK</button>
        <button id="btnSuper" class="touch-btn touch-btn-super">SUPER</button>
      </div>
    </div>
  </div>

  <!-- Game Scripts -->
  <script src="js/characters.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/engine/particle.js"></script>
  <script src="js/engine/input.js"></script>
  <script src="js/engine/ai.js"></script>
  <script src="js/engine/fighter.js"></script>
  <script src="js/engine/renderer.js"></script>
  <script src="js/game.js"></script>

</body>
</html>
